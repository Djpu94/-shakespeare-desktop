name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Verify tag matches root package version
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi
      - name: Run checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm audit --audit-level=high

  package:
    name: Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Build and package
        run: |
          pnpm build
          pnpm --filter @shakespeare/desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: apps/desktop/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
